<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#141210">
<title>Total</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141210;
    --surface: #1e1b17;
    --fg: #f4efe6;
    --muted: #a3988c;
    --accent: #e0a15a;
    --line: #3a342c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
  }
  button { cursor: pointer; font: inherit; color: inherit; }
  main {
    max-width: 32rem;
    margin: 0 auto;
    min-height: 100vh;
    padding: 1.25rem 1rem 2rem;
    display: flex;
    flex-direction: column;
  }
  .eyebrow {
    margin: 0;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .frame {
    margin-top: 0.75rem;
    height: 5in;
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 1.25rem;
    background: var(--surface);
    box-shadow: 0 18px 40px rgb(0 0 0 / 0.35);
    position: relative;
    overflow: hidden;
    padding: 0;
    display: block;
  }
  .frame img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .empty {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .change {
    position: absolute;
    right: 0.75rem;
    bottom: 0.75rem;
    background: rgb(20 18 16 / 0.8);
    color: var(--fg);
    border-radius: 999px;
    padding: 0.25rem 0.75rem;
    font-size: 0.75rem;
  }
  .row {
    margin-top: 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
  }
  h1 {
    margin: 0;
    font-family: Fraunces, Georgia, serif;
    font-weight: 500;
    font-size: 1.875rem;
    letter-spacing: -0.02em;
  }
  .controls { display: flex; align-items: center; gap: 0.5rem; }
  .step {
    width: 2.75rem;
    height: 2.75rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    font-size: 1.4rem;
    line-height: 1;
  }
  .step:active { transform: scale(0.95); }
  #total {
    width: 6rem;
    background: transparent;
    border: 0;
    color: var(--accent);
    text-align: center;
    font-family: Fraunces, Georgia, serif;
    font-size: 2.25rem;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  #total:focus { outline: none; }
  .foot {
    margin-top: 0.75rem;
    min-height: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
  }
  .hint, .remove {
    color: var(--muted);
    font-size: 0.875rem;
    background: none;
    border: 0;
    padding: 0;
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Frame</p>
  <button class="frame" id="frame" type="button" aria-label="Add a photo">
    <span class="empty" id="empty">Tap to place a photo</span>
  </button>
  <input class="sr" id="file" type="file" accept="image/*">
  <section class="row">
    <h1>Total</h1>
    <div class="controls">
      <button class="step" id="down" type="button" aria-label="Decrease total">−</button>
      <input id="total" aria-label="Total" inputmode="decimal" value="0">
      <button class="step" id="up" type="button" aria-label="Increase total">+</button>
    </div>
  </section>
  <div class="foot">
    <p class="hint" id="hint">Type the number, or use the buttons.</p>
    <button class="remove" id="remove" type="button" hidden>Remove</button>
  </div>
</main>
<script>
const KEY = "photo-total-v1";
const frame = document.getElementById("frame");
const file = document.getElementById("file");
const totalInput = document.getElementById("total");
const hint = document.getElementById("hint");
const removeBtn = document.getElementById("remove");
let photo = null;
let total = 0;

function formatNumber(n) {
  if (Number.isInteger(n)) return String(n);
  return String(Math.round(n * 1000) / 1000);
}

function showPhoto() {
  frame.querySelectorAll("img, .change").forEach((n) => n.remove());
  const empty = document.getElementById("empty");
  if (photo) {
    empty.hidden = true;
    const img = document.createElement("img");
    img.alt = "";
    img.src = photo;
    const chip = document.createElement("span");
    chip.className = "change";
    chip.textContent = "Change";
    frame.append(img, chip);
    frame.setAttribute("aria-label", "Change photo");
    removeBtn.hidden = false;
  } else {
    empty.hidden = false;
    frame.setAttribute("aria-label", "Add a photo");
    removeBtn.hidden = true;
  }
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({ photo, total }));
    hint.textContent = "Type the number, or use the buttons.";
  } catch (err) {
    photo = null;
    showPhoto();
    hint.textContent = "That photo is too big to keep on this device. Try a smaller one.";
  }
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (typeof data.photo === "string") photo = data.photo;
    if (typeof data.total === "number" && Number.isFinite(data.total)) {
      total = data.total;
      totalInput.value = formatNumber(total);
    }
  } catch (err) {}
  showPhoto();
}

function shrink(fileObj) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(fileObj);
    const img = new Image();
    img.onload = () => {
      const max = 1400;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      if (!ctx) { URL.revokeObjectURL(url); reject(new Error("canvas")); return; }
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/jpeg", 0.84));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image")); };
    img.src = url;
  });
}

frame.addEventListener("click", () => file.click());
file.addEventListener("change", async () => {
  const chosen = file.files && file.files[0];
  file.value = "";
  if (!chosen) return;
  if (!chosen.type.startsWith("image/")) {
    hint.textContent = "That file isn’t a photo.";
    return;
  }
  try {
    photo = await shrink(chosen);
    showPhoto();
    save();
  } catch (err) {
    hint.textContent = "Couldn’t read that photo. Try a JPG or PNG.";
  }
});
removeBtn.addEventListener("click", () => {
  photo = null;
  showPhoto();
  save();
});

function applyText(next) {
  if (!/^-?\d*\.?\d*$/.test(next)) {
    totalInput.value = formatNumber(total);
    return;
  }
  if (next === "" || next === "-" || next === "." || next === "-.") return;
  const n = Number(next);
  if (Number.isFinite(n)) total = n;
}

totalInput.addEventListener("input", () => applyText(totalInput.value));
totalInput.addEventListener("blur", () => {
  const raw = totalInput.value;
  if (raw === "" || raw === "-" || raw === "." || raw === "-.") {
    total = 0;
  } else {
    const n = Number(raw);
    total = Number.isFinite(n) ? n : total;
  }
  totalInput.value = formatNumber(total);
  save();
});
function step(delta) {
  total = Math.round((total + delta) * 1000) / 1000;
  totalInput.value = formatNumber(total);
  save();
}
document.getElementById("up").addEventListener("click", () => step(1));
document.getElementById("down").addEventListener("click", () => step(-1));
totalInput.addEventListener("change", save);

load();
</script>
</body>
</html>
